name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: [self-hosted, jarvis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
