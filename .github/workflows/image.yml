name: Container image
on:
  push:
    branches: [main]
concurrency:
  group: image-and-deploy-main
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: [self-hosted, jarvis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Require deployment credentials before publishing
        env:
          VPS_SSH_IP: ${{ secrets.VPS_SSH_IP }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          for name in VPS_SSH_IP VPS_SSH_USER VPS_SSH_PASSWORD VPS_SSH_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for the publish-and-restart workflow"
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alaborderie/f-0923-jev-model-router:latest
            ghcr.io/alaborderie/f-0923-jev-model-router:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: [self-hosted, jarvis]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Restart existing deployment after publishing
        env:
          VPS_SSH_IP: ${{ secrets.VPS_SSH_IP }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -p "$VPS_SSH_PORT" "$VPS_SSH_USER@$VPS_SSH_IP" \
            'sudo -n kubectl -n default rollout restart deployment/f-0923-jev-model-router && sudo -n kubectl -n default rollout status deployment/f-0923-jev-model-router --timeout=120s'
