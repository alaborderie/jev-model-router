name: Container image
on:
  push:
    branches: [main]
concurrency:
  group: image-main
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    # Only the canonical repository publishes; forks never push images.
    if: github.repository == 'alaborderie/jev-model-router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alaborderie/jev-model-router:latest
            ghcr.io/alaborderie/jev-model-router:${{ github.sha }}
