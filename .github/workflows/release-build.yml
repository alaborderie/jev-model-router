name: Prepare release archives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: [self-hosted, jarvis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/package-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: mroute-release-candidate
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
